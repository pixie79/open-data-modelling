<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .code-bg { fill: #252526; }
      .text { font-family: 'Courier New', monospace; font-size: 14px; fill: #d4d4d4; }
      .keyword { fill: #569cd6; }
      .string { fill: #ce9178; }
      .function { fill: #dcdcaa; }
      .comment { fill: #6a9955; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg" />
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Data Modelling SDK</text>
  
  <!-- Code editor -->
  <rect x="50" y="60" width="700" height="400" class="code-bg" rx="5" />
  
  <!-- Code content -->
  <text x="70" y="90" class="keyword">import</text>
  <text x="130" y="90" class="text"> { DataContract } </text>
  <text x="280" y="90" class="keyword">from</text>
  <text x="330" y="90" class="string">'@opendatamodelling/sdk'</text>
  <text x="70" y="120" class="text">;</text>
  <text x="70" y="150" class="text">const contract = </text>
  <text x="200" y="150" class="keyword">new</text>
  <text x="240" y="150" class="function">DataContract</text>
  <text x="370" y="150" class="text">({</text>
  <text x="70" y="180" class="text">  name: </text>
  <text x="140" y="180" class="string">'user-profile'</text>
  <text x="280" y="180" class="text">,</text>
  <text x="70" y="210" class="text">  version: </text>
  <text x="150" y="210" class="string">'1.0.0'</text>
  <text x="240" y="210" class="text">,</text>
  <text x="70" y="240" class="text">  schema: { ... }</text>
  <text x="70" y="270" class="text">});</text>
  <text x="70" y="300" class="comment">// Validate data against contract</text>
  <text x="70" y="330" class="text">const isValid = contract.</text>
  <text x="280" y="330" class="function">validate</text>
  <text x="360" y="330" class="text">(userData);</text>
  
  <!-- Terminal output -->
  <rect x="50" y="480" width="700" height="15" fill="#0e0e0e" />
  <text x="70" y="492" class="text" font-size="12px">$ npm install @opendatamodelling/sdk</text>
</svg>

