<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .arrow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .step { font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">Export Process</text>
  
  <!-- Step 1: Select Contract -->
  <rect x="50" y="70" width="150" height="80" rx="5" class="box" />
  <text x="125" y="100" class="step" text-anchor="middle">1. Select Contract</text>
  <text x="125" y="120" class="text" text-anchor="middle" font-size="12px">Choose contract</text>
  <text x="125" y="135" class="text" text-anchor="middle" font-size="12px">to export</text>
  
  <!-- Step 2: Choose Format -->
  <rect x="250" y="70" width="150" height="80" rx="5" class="box" />
  <text x="325" y="100" class="step" text-anchor="middle">2. Choose Format</text>
  <text x="325" y="120" class="text" text-anchor="middle" font-size="12px">Select target</text>
  <text x="325" y="135" class="text" text-anchor="middle" font-size="12px">format</text>
  
  <!-- Step 3: Configure -->
  <rect x="450" y="70" width="150" height="80" rx="5" class="box" />
  <text x="525" y="100" class="step" text-anchor="middle">3. Configure</text>
  <text x="525" y="120" class="text" text-anchor="middle" font-size="12px">Set format</text>
  <text x="525" y="135" class="text" text-anchor="middle" font-size="12px">options</text>
  
  <!-- Step 4: Generate -->
  <rect x="650" y="70" width="150" height="80" rx="5" class="box" />
  <text x="725" y="100" class="step" text-anchor="middle">4. Generate</text>
  <text x="725" y="120" class="text" text-anchor="middle" font-size="12px">System generates</text>
  <text x="725" y="135" class="text" text-anchor="middle" font-size="12px">export</text>
  
  <!-- Step 5: Review -->
  <rect x="200" y="200" width="150" height="80" rx="5" class="box" />
  <text x="275" y="230" class="step" text-anchor="middle">5. Review</text>
  <text x="275" y="250" class="text" text-anchor="middle" font-size="12px">Review exported</text>
  <text x="275" y="265" class="text" text-anchor="middle" font-size="12px">content</text>
  
  <!-- Step 6: Download/Save -->
  <rect x="450" y="200" width="200" height="80" rx="5" class="box" />
  <text x="550" y="230" class="step" text-anchor="middle">6. Download/Save</text>
  <text x="550" y="250" class="text" text-anchor="middle" font-size="12px">Download file or</text>
  <text x="550" y="265" class="text" text-anchor="middle" font-size="12px">copy to clipboard</text>
  
  <!-- Arrows -->
  <line x1="200" y1="110" x2="250" y2="110" class="arrow" />
  <line x1="400" y1="110" x2="450" y2="110" class="arrow" />
  <line x1="600" y1="110" x2="650" y2="110" class="arrow" />
  <line x1="650" y1="150" x2="275" y2="200" class="arrow" />
  <line x1="350" y1="240" x2="450" y2="240" class="arrow" />
  
  <!-- Format examples -->
  <rect x="50" y="330" width="800" height="140" fill="#f5f5f5" stroke="#0066cc" stroke-width="2" rx="5" />
  <text x="450" y="360" class="text" text-anchor="middle" font-weight="bold" font-size="16px">Export Formats</text>
  <text x="150" y="390" class="text" text-anchor="middle">JSON Schema</text>
  <text x="300" y="390" class="text" text-anchor="middle">Avro</text>
  <text x="450" y="390" class="text" text-anchor="middle">Protobuf</text>
  <text x="600" y="390" class="text" text-anchor="middle">Markdown</text>
  <text x="750" y="390" class="text" text-anchor="middle">ODCS/ODPS</text>
  <text x="150" y="420" class="text" text-anchor="middle" font-size="12px">.json</text>
  <text x="300" y="420" class="text" text-anchor="middle" font-size="12px">.avsc</text>
  <text x="450" y="420" class="text" text-anchor="middle" font-size="12px">.proto</text>
  <text x="600" y="420" class="text" text-anchor="middle" font-size="12px">.md</text>
  <text x="750" y="420" class="text" text-anchor="middle" font-size="12px">.yaml</text>
  <text x="150" y="450" class="text" text-anchor="middle" font-size="12px">HTML, OpenAPI</text>
  <text x="300" y="450" class="text" text-anchor="middle" font-size="12px">and more</text>
</svg>

