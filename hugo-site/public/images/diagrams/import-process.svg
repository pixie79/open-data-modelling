<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .arrow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .step { font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">Import Process</text>
  
  <!-- Step 1: Select Source -->
  <rect x="50" y="70" width="150" height="80" rx="5" class="box" />
  <text x="125" y="100" class="step" text-anchor="middle">1. Select Source</text>
  <text x="125" y="120" class="text" text-anchor="middle" font-size="12px">Choose format</text>
  <text x="125" y="135" class="text" text-anchor="middle" font-size="12px">(JSON Schema,</text>
  <text x="125" y="150" class="text" text-anchor="middle" font-size="12px">Avro, etc.)</text>
  
  <!-- Step 2: Upload/Provide -->
  <rect x="250" y="70" width="150" height="80" rx="5" class="box" />
  <text x="325" y="100" class="step" text-anchor="middle">2. Upload/Provide</text>
  <text x="325" y="120" class="text" text-anchor="middle" font-size="12px">Upload file or</text>
  <text x="325" y="135" class="text" text-anchor="middle" font-size="12px">paste content</text>
  
  <!-- Step 3: Parse & Validate -->
  <rect x="450" y="70" width="150" height="80" rx="5" class="box" />
  <text x="525" y="100" class="step" text-anchor="middle">3. Parse &amp; Validate</text>
  <text x="525" y="120" class="text" text-anchor="middle" font-size="12px">System parses</text>
  <text x="525" y="135" class="text" text-anchor="middle" font-size="12px">and validates</text>
  
  <!-- Step 4: Transform -->
  <rect x="650" y="70" width="150" height="80" rx="5" class="box" />
  <text x="725" y="100" class="step" text-anchor="middle">4. Transform</text>
  <text x="725" y="120" class="text" text-anchor="middle" font-size="12px">Convert to</text>
  <text x="725" y="135" class="text" text-anchor="middle" font-size="12px">internal format</text>
  
  <!-- Step 5: Review -->
  <rect x="150" y="200" width="150" height="80" rx="5" class="box" />
  <text x="225" y="230" class="step" text-anchor="middle">5. Review</text>
  <text x="225" y="250" class="text" text-anchor="middle" font-size="12px">Review imported</text>
  <text x="225" y="265" class="text" text-anchor="middle" font-size="12px">schema</text>
  
  <!-- Step 6: Save -->
  <rect x="400" y="200" width="150" height="80" rx="5" class="box" />
  <text x="475" y="230" class="step" text-anchor="middle">6. Save</text>
  <text x="475" y="250" class="text" text-anchor="middle" font-size="12px">Save as new</text>
  <text x="475" y="265" class="text" text-anchor="middle" font-size="12px">data contract</text>
  
  <!-- Arrows -->
  <line x1="200" y1="110" x2="250" y2="110" class="arrow" />
  <line x1="400" y1="110" x2="450" y2="110" class="arrow" />
  <line x1="600" y1="110" x2="650" y2="110" class="arrow" />
  <line x1="650" y1="150" x2="225" y2="200" class="arrow" />
  <line x1="300" y1="240" x2="400" y2="240" class="arrow" />
  
  <!-- Format examples -->
  <rect x="50" y="330" width="800" height="140" fill="#f5f5f5" stroke="#0066cc" stroke-width="2" rx="5" />
  <text x="450" y="360" class="text" text-anchor="middle" font-weight="bold" font-size="16px">Supported Formats</text>
  <text x="150" y="390" class="text" text-anchor="middle">JSON Schema</text>
  <text x="300" y="390" class="text" text-anchor="middle">Avro</text>
  <text x="450" y="390" class="text" text-anchor="middle">Protobuf</text>
  <text x="600" y="390" class="text" text-anchor="middle">OpenAPI</text>
  <text x="750" y="390" class="text" text-anchor="middle">ODCS</text>
  <text x="150" y="420" class="text" text-anchor="middle" font-size="12px">JSON</text>
  <text x="300" y="420" class="text" text-anchor="middle" font-size="12px">.avsc</text>
  <text x="450" y="420" class="text" text-anchor="middle" font-size="12px">.proto</text>
  <text x="600" y="420" class="text" text-anchor="middle" font-size="12px">YAML/JSON</text>
  <text x="750" y="420" class="text" text-anchor="middle" font-size="12px">YAML</text>
</svg>

