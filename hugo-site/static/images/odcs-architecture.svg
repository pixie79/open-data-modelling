<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .component { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .core { fill: #cce5ff; stroke: #0066cc; stroke-width: 3; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .arrow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">ODCS Framework Architecture</text>
  
  <!-- Core: Contract Definition -->
  <rect x="300" y="80" width="300" height="100" rx="10" class="core" />
  <text x="450" y="115" class="title" text-anchor="middle">Contract Definition</text>
  <text x="450" y="140" class="text" text-anchor="middle">Schema Specification</text>
  <text x="450" y="155" class="text" text-anchor="middle">Metadata &amp; Versioning</text>
  
  <!-- Component 1: Validation Engine -->
  <rect x="50" y="220" width="200" height="120" rx="8" class="component" />
  <text x="150" y="250" class="title" text-anchor="middle">Validation</text>
  <text x="150" y="270" class="text" text-anchor="middle">Engine</text>
  <text x="150" y="290" class="text" text-anchor="middle" font-size="12px">Runtime validation</text>
  <text x="150" y="305" class="text" text-anchor="middle" font-size="12px">Type checking</text>
  <text x="150" y="320" class="text" text-anchor="middle" font-size="12px">Constraint enforcement</text>
  
  <!-- Component 2: Version Management -->
  <rect x="350" y="220" width="200" height="120" rx="8" class="component" />
  <text x="450" y="250" class="title" text-anchor="middle">Version</text>
  <text x="450" y="270" class="text" text-anchor="middle">Management</text>
  <text x="450" y="290" class="text" text-anchor="middle" font-size="12px">Schema evolution</text>
  <text x="450" y="305" class="text" text-anchor="middle" font-size="12px">Compatibility rules</text>
  <text x="450" y="320" class="text" text-anchor="middle" font-size="12px">Migration support</text>
  
  <!-- Component 3: Tool Integration -->
  <rect x="650" y="220" width="200" height="120" rx="8" class="component" />
  <text x="750" y="250" class="title" text-anchor="middle">Tool</text>
  <text x="750" y="270" class="text" text-anchor="middle">Integration</text>
  <text x="750" y="290" class="text" text-anchor="middle" font-size="12px">Data pipelines</text>
  <text x="750" y="305" class="text" text-anchor="middle" font-size="12px">APIs &amp; platforms</text>
  <text x="750" y="320" class="text" text-anchor="middle" font-size="12px">Analytics tools</text>
  
  <!-- Arrows from core to components -->
  <line x1="350" y1="150" x2="150" y2="220" class="arrow" />
  <line x1="450" y1="180" x2="450" y2="220" class="arrow" />
  <line x1="550" y1="150" x2="750" y2="220" class="arrow" />
  
  <!-- Data flow -->
  <rect x="50" y="380" width="800" height="80" rx="5" fill="#f5f5f5" stroke="#0066cc" stroke-width="2" />
  <text x="450" y="410" class="title" text-anchor="middle">Data Flow</text>
  <text x="150" y="435" class="text" text-anchor="middle">Input Data</text>
  <text x="450" y="435" class="text" text-anchor="middle">ODCS Framework</text>
  <text x="750" y="435" class="text" text-anchor="middle">Validated Output</text>
  <line x1="250" y1="430" x2="350" y2="430" class="arrow" />
  <line x1="550" y1="430" x2="650" y2="430" class="arrow" />
</svg>

