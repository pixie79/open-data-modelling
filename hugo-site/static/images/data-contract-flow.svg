<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .arrow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a1a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Data Contract Lifecycle</text>
  
  <!-- Step 1: Definition -->
  <rect x="50" y="80" width="140" height="80" rx="5" class="box" />
  <text x="120" y="110" class="title" text-anchor="middle">1. Definition</text>
  <text x="120" y="130" class="text" text-anchor="middle">Create contract</text>
  <text x="120" y="145" class="text" text-anchor="middle">specification</text>
  
  <!-- Step 2: Publication -->
  <rect x="250" y="80" width="140" height="80" rx="5" class="box" />
  <text x="320" y="110" class="title" text-anchor="middle">2. Publication</text>
  <text x="320" y="130" class="text" text-anchor="middle">Make contract</text>
  <text x="320" y="145" class="text" text-anchor="middle">available</text>
  
  <!-- Step 3: Validation -->
  <rect x="450" y="80" width="140" height="80" rx="5" class="box" />
  <text x="520" y="110" class="title" text-anchor="middle">3. Validation</text>
  <text x="520" y="130" class="text" text-anchor="middle">Check data</text>
  <text x="520" y="145" class="text" text-anchor="middle">against contract</text>
  
  <!-- Step 4: Evolution -->
  <rect x="650" y="80" width="140" height="80" rx="5" class="box" />
  <text x="720" y="110" class="title" text-anchor="middle">4. Evolution</text>
  <text x="720" y="130" class="text" text-anchor="middle">Update contract</text>
  <text x="720" y="145" class="text" text-anchor="middle">with versioning</text>
  
  <!-- Arrows -->
  <line x1="190" y1="120" x2="250" y2="120" class="arrow" />
  <line x1="390" y1="120" x2="450" y2="120" class="arrow" />
  <line x1="590" y1="120" x2="650" y2="120" class="arrow" />
  
  <!-- Feedback loop -->
  <path d="M 720 200 Q 400 280 120 200" class="arrow" stroke-dasharray="5,5" />
  <text x="400" y="270" class="text" text-anchor="middle" fill="#666666">Iterate &amp; Improve</text>
  
  <!-- Data flow -->
  <rect x="50" y="280" width="700" height="100" rx="5" fill="#f5f5f5" stroke="#0066cc" stroke-width="2" />
  <text x="400" y="310" class="title" text-anchor="middle">Data Pipeline</text>
  <text x="150" y="335" class="text" text-anchor="middle">Producer</text>
  <text x="400" y="335" class="text" text-anchor="middle">Contract</text>
  <text x="650" y="335" class="text" text-anchor="middle">Consumer</text>
  <line x1="200" y1="330" x2="350" y2="330" class="arrow" />
  <line x1="450" y1="330" x2="600" y2="330" class="arrow" />
</svg>

