<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header { fill: #0066cc; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .code { font-family: 'Courier New', monospace; font-size: 12px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
      .method { fill: #00aa00; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg" />
  
  <!-- Header -->
  <rect width="800" height="60" class="header" />
  <text x="400" y="40" class="title" text-anchor="middle">Data Modelling API</text>
  
  <!-- API Documentation -->
  <text x="50" y="100" class="text" font-weight="bold" font-size="16px">API Endpoints</text>
  
  <!-- Endpoint 1 -->
  <text x="70" y="140" class="method">GET</text>
  <text x="120" y="140" class="code">/api/v1/contracts</text>
  <text x="70" y="165" class="text" font-size="12px">List all data contracts</text>
  
  <!-- Endpoint 2 -->
  <text x="70" y="200" class="method">POST</text>
  <text x="120" y="200" class="code">/api/v1/contracts</text>
  <text x="70" y="225" class="text" font-size="12px">Create a new contract</text>
  
  <!-- Endpoint 3 -->
  <text x="70" y="260" class="method">GET</text>
  <text x="120" y="260" class="code">/api/v1/contracts/{id}</text>
  <text x="70" y="285" class="text" font-size="12px">Get contract details</text>
  
  <!-- Example Request -->
  <text x="50" y="330" class="text" font-weight="bold" font-size="16px">Example Request</text>
  <rect x="50" y="350" width="700" height="120" fill="#f5f5f5" stroke="#0066cc" stroke-width="1" rx="5" />
  <text x="70" y="375" class="code">curl -X POST https://api.opendatamodelling.com/v1/contracts \</text>
  <text x="70" y="395" class="code">  -H "Authorization: Bearer $API_KEY" \</text>
  <text x="70" y="415" class="code">  -H "Content-Type: application/json" \</text>
  <text x="70" y="435" class="code">  -d '{"name": "user-profile", "version": "1.0.0"}'</text>
  <text x="70" y="455" class="code">{"status": "success", "id": "contract-123"}</text>
</svg>

