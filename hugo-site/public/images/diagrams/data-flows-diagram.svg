<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .model { fill: #cce5ff; stroke: #0066cc; stroke-width: 2; }
      .flow { fill: #fff4e6; stroke: #ff9800; stroke-width: 2; }
      .arrow { stroke: #0066cc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .flow-arrow { stroke: #ff9800; stroke-width: 2; fill: none; marker-end: url(#flowarrow); }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
    <marker id="flowarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">Data Flows and Data Models</text>
  
  <!-- Source Model -->
  <rect x="50" y="100" width="180" height="120" rx="5" class="model" />
  <text x="140" y="130" class="text" text-anchor="middle" font-weight="bold">Source Model</text>
  <text x="140" y="155" class="text" text-anchor="middle" font-size="12px">sourceOrder</text>
  <text x="70" y="180" class="text" font-size="11px">• order_id: string</text>
  <text x="70" y="200" class="text" font-size="11px">• customer_name: string</text>
  
  <!-- Transformation -->
  <rect x="300" y="100" width="200" height="120" rx="5" class="flow" />
  <text x="400" y="130" class="text" text-anchor="middle" font-weight="bold">Data Flow</text>
  <text x="400" y="155" class="text" text-anchor="middle" font-size="12px">Transformation</text>
  <text x="320" y="180" class="text" font-size="11px">• Map fields</text>
  <text x="320" y="200" class="text" font-size="11px">• Validate contracts</text>
  
  <!-- Destination Model -->
  <rect x="570" y="100" width="180" height="120" rx="5" class="model" />
  <text x="660" y="130" class="text" text-anchor="middle" font-weight="bold">Destination Model</text>
  <text x="660" y="155" class="text" text-anchor="middle" font-size="12px">targetOrder</text>
  <text x="590" y="180" class="text" font-size="11px">• id: string</text>
  <text x="590" y="200" class="text" font-size="11px">• customerId: string</text>
  
  <!-- Flow arrows -->
  <line x1="230" y1="160" x2="300" y2="160" class="flow-arrow" />
  <line x1="500" y1="160" x2="570" y2="160" class="flow-arrow" />
  
  <!-- Contracts -->
  <rect x="50" y="280" width="180" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="140" y="305" class="text" text-anchor="middle" font-size="12px" font-weight="bold">Contract</text>
  <text x="140" y="325" class="text" text-anchor="middle" font-size="11px">source-order-contract</text>
  
  <rect x="300" y="280" width="200" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="400" y="305" class="text" text-anchor="middle" font-size="12px" font-weight="bold">Contract</text>
  <text x="400" y="325" class="text" text-anchor="middle" font-size="11px">transform-contract</text>
  
  <rect x="570" y="280" width="180" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="660" y="305" class="text" text-anchor="middle" font-size="12px" font-weight="bold">Contract</text>
  <text x="660" y="325" class="text" text-anchor="middle" font-size="11px">target-order-contract</text>
  
  <!-- Contract arrows -->
  <line x1="140" y1="280" x2="140" y2="220" class="arrow" stroke-dasharray="3,3" />
  <line x1="400" y1="280" x2="400" y2="220" class="arrow" stroke-dasharray="3,3" />
  <line x1="660" y1="280" x2="660" y2="220" class="arrow" stroke-dasharray="3,3" />
  
  <!-- Flow components -->
  <rect x="50" y="400" width="700" height="160" fill="#f5f5f5" stroke="#0066cc" stroke-width="2" rx="5" />
  <text x="400" y="430" class="text" text-anchor="middle" font-weight="bold" font-size="16px">Data Flow Components</text>
  
  <!-- Sources -->
  <text x="150" y="460" class="text" text-anchor="middle" font-weight="bold">Sources</text>
  <text x="150" y="480" class="text" text-anchor="middle" font-size="11px">Databases</text>
  <text x="150" y="495" class="text" text-anchor="middle" font-size="11px">APIs</text>
  <text x="150" y="510" class="text" text-anchor="middle" font-size="11px">Files</text>
  <text x="150" y="525" class="text" text-anchor="middle" font-size="11px">Streams</text>
  
  <!-- Transformations -->
  <text x="400" y="460" class="text" text-anchor="middle" font-weight="bold">Transformations</text>
  <text x="400" y="480" class="text" text-anchor="middle" font-size="11px">Filtering</text>
  <text x="400" y="495" class="text" text-anchor="middle" font-size="11px">Mapping</text>
  <text x="400" y="510" class="text" text-anchor="middle" font-size="11px">Aggregation</text>
  <text x="400" y="525" class="text" text-anchor="middle" font-size="11px">Validation</text>
  
  <!-- Destinations -->
  <text x="650" y="460" class="text" text-anchor="middle" font-weight="bold">Destinations</text>
  <text x="650" y="480" class="text" text-anchor="middle" font-size="11px">Warehouses</text>
  <text x="650" y="495" class="text" text-anchor="middle" font-size="11px">Applications</text>
  <text x="650" y="510" class="text" text-anchor="middle" font-size="11px">APIs</text>
  <text x="650" y="525" class="text" text-anchor="middle" font-size="11px">Storage</text>
  
  <!-- Flow arrows in components -->
  <line x1="250" y1="500" x2="350" y2="500" class="flow-arrow" />
  <line x1="500" y1="500" x2="600" y2="500" class="flow-arrow" />
</svg>

