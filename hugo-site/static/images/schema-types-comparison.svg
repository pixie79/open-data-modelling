<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .box { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .header { fill: #0066cc; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .header-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: white; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .check { fill: #00aa00; }
      .cross { fill: #cc0000; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">Schema Types Comparison</text>
  
  <!-- Table headers -->
  <rect x="50" y="60" width="900" height="40" class="header" />
  <text x="150" y="85" class="header-text" text-anchor="middle">Schema Type</text>
  <text x="350" y="85" class="header-text" text-anchor="middle">Best For</text>
  <text x="550" y="85" class="header-text" text-anchor="middle">Strengths</text>
  <text x="750" y="85" class="header-text" text-anchor="middle">Use Cases</text>
  
  <!-- JSON Schema row -->
  <rect x="50" y="100" width="900" height="80" class="box" />
  <text x="150" y="125" class="text" text-anchor="middle" font-weight="bold">JSON Schema</text>
  <text x="150" y="145" class="text" text-anchor="middle" font-size="11px">Human-readable</text>
  <text x="350" y="130" class="text" text-anchor="middle" font-size="12px">APIs, Web Apps</text>
  <text x="350" y="150" class="text" text-anchor="middle" font-size="12px">JSON Contracts</text>
  <text x="550" y="125" class="text" text-anchor="middle" font-size="11px">Easy to learn</text>
  <text x="550" y="145" class="text" text-anchor="middle" font-size="11px">Rich validation</text>
  <text x="750" y="130" class="text" text-anchor="middle" font-size="11px">API validation</text>
  <text x="750" y="150" class="text" text-anchor="middle" font-size="11px">Data contracts</text>
  
  <!-- Avro row -->
  <rect x="50" y="180" width="900" height="80" class="box" />
  <text x="150" y="205" class="text" text-anchor="middle" font-weight="bold">Avro</text>
  <text x="150" y="225" class="text" text-anchor="middle" font-size="11px">Binary format</text>
  <text x="350" y="210" class="text" text-anchor="middle" font-size="12px">Data Pipelines</text>
  <text x="350" y="230" class="text" text-anchor="middle" font-size="12px">Message Queues</text>
  <text x="550" y="205" class="text" text-anchor="middle" font-size="11px">Schema evolution</text>
  <text x="550" y="225" class="text" text-anchor="middle" font-size="11px">Efficient encoding</text>
  <text x="750" y="210" class="text" text-anchor="middle" font-size="11px">Kafka, pipelines</text>
  <text x="750" y="230" class="text" text-anchor="middle" font-size="11px">Streaming data</text>
  
  <!-- Protobuf row -->
  <rect x="50" y="260" width="900" height="80" class="box" />
  <text x="150" y="285" class="text" text-anchor="middle" font-weight="bold">Protobuf</text>
  <text x="150" y="305" class="text" text-anchor="middle" font-size="11px">Binary format</text>
  <text x="350" y="290" class="text" text-anchor="middle" font-size="12px">Microservices</text>
  <text x="350" y="310" class="text" text-anchor="middle" font-size="12px">High Performance</text>
  <text x="550" y="285" class="text" text-anchor="middle" font-size="11px">Very efficient</text>
  <text x="550" y="305" class="text" text-anchor="middle" font-size="11px">Fast serialization</text>
  <text x="750" y="290" class="text" text-anchor="middle" font-size="11px">gRPC, APIs</text>
  <text x="750" y="310" class="text" text-anchor="middle" font-size="11px">Performance-critical</text>
  
  <!-- Relational row -->
  <rect x="50" y="340" width="900" height="80" class="box" />
  <text x="150" y="365" class="text" text-anchor="middle" font-weight="bold">Relational</text>
  <text x="150" y="385" class="text" text-anchor="middle" font-size="11px">SQL databases</text>
  <text x="350" y="370" class="text" text-anchor="middle" font-size="12px">Structured Storage</text>
  <text x="350" y="390" class="text" text-anchor="middle" font-size="12px">Transactions</text>
  <text x="550" y="365" class="text" text-anchor="middle" font-size="11px">ACID compliance</text>
  <text x="550" y="385" class="text" text-anchor="middle" font-size="11px">Powerful queries</text>
  <text x="750" y="370" class="text" text-anchor="middle" font-size="11px">SQL databases</text>
  <text x="750" y="390" class="text" text-anchor="middle" font-size="11px">Data warehouses</text>
  
  <!-- Document row -->
  <rect x="50" y="420" width="900" height="80" class="box" />
  <text x="150" y="445" class="text" text-anchor="middle" font-weight="bold">Document</text>
  <text x="150" y="465" class="text" text-anchor="middle" font-size="11px">NoSQL databases</text>
  <text x="350" y="450" class="text" text-anchor="middle" font-size="12px">Flexible Structures</text>
  <text x="350" y="470" class="text" text-anchor="middle" font-size="12px">Semi-structured</text>
  <text x="550" y="445" class="text" text-anchor="middle" font-size="11px">Flexible schema</text>
  <text x="550" y="465" class="text" text-anchor="middle" font-size="11px">Easy evolution</text>
  <text x="750" y="450" class="text" text-anchor="middle" font-size="11px">MongoDB, content</text>
  <text x="750" y="470" class="text" text-anchor="middle" font-size="11px">CMS, catalogs</text>
  
  <!-- Legend -->
  <text x="500" y="540" class="text" text-anchor="middle" font-size="12px" fill="#666666">
    Choose schema type based on your data structure, performance needs, and tool ecosystem
  </text>
</svg>

